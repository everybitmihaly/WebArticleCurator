"site_name": "alfahir"

# The search-based archive (https://alfahir.hu/kereso?kereses=&from=YYYY-MM-DD&to=YYYY-MM-DD) is gone since the redesign,
#  the paginated list of all articles is used instead (2026-10).
# The portal answered 403 for some minutes after a quick burst of requests, so crawl it slowly
#  (e.g. --max-no-of-calls-in-period 1 --limit-period 4)!
"columns":
    "main-column":
        "archive_url_format": "https://alfahir.hu/hirek/oldalak/#pagenum"

        "initial_pagenum": 1

"portal_specific_exctractor_functions_file": "../extractors/site_specific_extractor_functions_news_ngvmt.py"
"extract_next_page_url_fun": "extract_next_page_url_alfahir"
"extract_article_urls_from_page_fun": "extract_article_urls_from_page_alfahir"
"next_page_of_article_fun": "next_page_of_article_alfahir"

"next_url_by_pagenum": false
"infinite_scrolling": false
"archive_page_urls_by_date": false
"go_reverse_in_archive": false
"verify_request": true
"ignore_archive_cache": false

"corpus_converter_file": "../extractors/corpus_converters.py"
"corpus_converter": "MultiPageArticleConverter"
